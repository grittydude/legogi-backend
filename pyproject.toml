[project]
name = "legogi-backend"
version = "0.1.0"
description = "API for the L'egogi personal finance app"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi (>=0.115,<1)",
    "uvicorn[standard] (>=0.32,<1)",
    "pydantic-settings (>=2.6,<3)",
]

[tool.poetry]
# This is an application, not a library we publish, so Poetry should not
# try to install `app` as a package.
package-mode = false

[tool.poetry.group.dev.dependencies]
ruff = ">=0.8,<1"
mypy = "^1.13"
pytest = ">=8.3,<9"
pytest-cov = ">=6,<8"
httpx = ">=0.27,<1"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: import sorting, B: bugbear,
# UP: modern syntax, N: naming, SIM: simplifications.
select = ["E", "W", "F", "I", "B", "UP", "N", "SIM"]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
# Fail on a misspelled @pytest.mark instead of silently ignoring it, and list
# skipped or failed tests in a short summary at the end.
addopts = "--strict-markers -ra"
filterwarnings = [
    # Starlette now prefers `httpx2` for TestClient; `httpx` still works.
    # Remove this line once we switch the dev dependency to httpx2.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.coverage.run]
# Measure the app, not the tests themselves.
omit = ["app/tests/*"]
